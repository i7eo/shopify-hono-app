    "tsx": "^4.22.4"
    "turbo": "^2.9.14"
  "react":
    "react": "^19.2.6"
    "react-dom": "^19.2.6"
    "@types/react": "^19.2.15"
    "@types/react-dom": "^19.2.3"
    "@vitejs/plugin-react": "^6.0.2"
    "babel-plugin-react-compiler": "^1.0.0"
  "vue":
    "vue": "^3.5.34"
