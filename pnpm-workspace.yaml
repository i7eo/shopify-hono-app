  - "*@eslint*"
  - "*prettier*"
  - "*lint-staged*"
  - "*stylelint*"
  - "*commitlint*"
  - "*@commitlint*"
  - "*cz*"
  - "*simple-git-hooks*"
  - "*changeset*"

