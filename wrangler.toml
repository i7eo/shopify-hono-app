name = "shopify-hono-app"
main = "src/index.ts"
compatibility_date = "2026-05-18"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
SHOPIFY_API_VERSION = "2026-04"

# Secrets (set via `wrangler secret put` or .dev.vars for local dev):
# SHOPIFY_API_KEY
# SHOPIFY_API_SECRET
# SHOPIFY_APP_URL
# SCOPES

[[kv_namespaces]]
binding = "sofary"
id = "b5a86d0381b54d3787bc0a53c2bb3198"
